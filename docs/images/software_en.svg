<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 840 300' class='sw' font-family='Raleway,Helvetica Neue,Helvetica,Arial,sans-serif'>
<style>.sw text{font-size:15px;font-weight:400}.sw .sw-h{font-size:19px;font-weight:700;fill:#0a7d44}.sw .sw-c{font-size:15px;font-family:Menlo,Consolas,monospace;fill:#5f6368}.sw .sw-t{fill:#111}.sw .sw-m{fill:#5f6368;font-size:13px}.sw .sw-box{fill:#0a7d44;fill-opacity:.07;stroke:#0a7d44;stroke-opacity:.6;stroke-width:1.5}.sw .sw-l{stroke:#0a7d44;stroke-opacity:.35;stroke-width:1}.sw .sw-d,.sw .sw-p{fill:#0a7d44}.sw .sw-a{stroke:#0a7d44;stroke-width:2}@media (prefers-color-scheme:dark){.sw text{font-size:15px;font-weight:400}.sw .sw-h{font-size:19px;font-weight:700;fill:#30d158}.sw .sw-c{font-size:15px;font-family:Menlo,Consolas,monospace;fill:#a0a0a8}.sw .sw-t{fill:#eee}.sw .sw-m{fill:#a0a0a8;font-size:13px}.sw .sw-box{fill:#30d158;fill-opacity:.07;stroke:#30d158;stroke-opacity:.6;stroke-width:1.5}.sw .sw-l{stroke:#30d158;stroke-opacity:.35;stroke-width:1}.sw .sw-d,.sw .sw-p{fill:#30d158}.sw .sw-a{stroke:#30d158;stroke-width:2}}</style>
<rect class='sw-box' x='6' y='6' width='370' height='252' rx='8'/>
<text class='sw-h' x='28' y='40'>Core 1</text>
<text class='sw-c' x='111.0' y='40'>scopeTask</text>
