; PlatformIO-Alternative zur Arduino IDE
; Bauen:   pio run      Flashen:   pio run -t upload      Monitor:   pio device monitor

[platformio]
src_dir = ESP32_OscilloscopeClock_v2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
lib_deps =
    olikraus/U8g2@^2.35.0
