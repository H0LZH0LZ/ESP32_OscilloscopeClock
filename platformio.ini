; PlatformIO-Alternative zur Arduino IDE – zwei Varianten des Partitionsschemas
;   Variante A, Huge APP (Standard):  pio run -t upload
;   Variante B, Standardschema:       pio run -e standard -t upload
; Monitor: pio device monitor
; Gespeicherte WLANs und Einstellungen (NVS) liegen bei beiden an derselben Stelle
; und bleiben beim Wechsel erhalten.

[platformio]
src_dir = ESP32_OscilloscopeClock_v2.0
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
lib_deps =
    olikraus/U8g2@^2.35.0

; Variante A (empfohlen): 3 MB für das Programm statt 1,25 MB, Belegung ca. 39 %
; (die Uhr nutzt weder OTA-Updates noch SPIFFS)
[env:esp32dev]
board_build.partitions = huge_app.csv

; Variante B: Standardschema mit 1,25 MB für das Programm, Belegung ca. 94 %
[env:standard]
board_build.partitions = default.csv
