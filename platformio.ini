; PlatformIO-Alternative zur Arduino IDE
; Bauen:   pio run      Flashen:   pio run -t upload      Monitor:   pio device monitor

[platformio]
src_dir = ESP32_OscilloscopeClock_v2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
; 3 MB für das Programm statt 1,25 MB (die Uhr nutzt weder OTA-Updates noch SPIFFS).
; Der Einstellungsspeicher (NVS) liegt an derselben Stelle wie beim Standardschema –
; gespeicherte WLANs und Einstellungen bleiben beim Umstellen erhalten.
board_build.partitions = huge_app.csv
lib_deps =
    olikraus/U8g2@^2.35.0
